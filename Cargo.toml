[workspace]
members = ["crates/mash-ai", "crates/mash-agent", "crates/mash-core", "crates/mashd", "crates/mash"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0.0"
futures-core = "0.3"
iocraft = "0.7"
mash-agent = { path = "crates/mash-agent" }
mash-ai = { path = "crates/mash-ai" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
